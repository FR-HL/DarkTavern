appId: com.darktavern.app
productName: DarkTavern
directories:
  output: dist
  buildResources: resources
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/**/*.node"
  - "**/node_modules/koffi/**/*"
files:
  - assets/**/*
  - node_modules/**/*
  - package.json
  - settings.ini
  - src/**/*
  - ui/**/*
  - chinese/**/*
win:
  icon: assets/images/icon.ico
  target:
    - nsis
  extraFiles:
    - from: chinese/ocr-service/dist/ocr-service/
      to: resources/chinese/ocr-service/
    - from: chinese/mapping/
      to: resources/chinese/mapping/
    - from: models/
      to: native/models/
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
