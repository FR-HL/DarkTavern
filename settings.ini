[general]

; Launch DarkTavern when you login to your computer
;   Allowed values: true, false
launch_on_startup = false

; Tooltip position relative to detected item
;   Allowed values: attached, top-left, top-right, bottom-left, bottom-right
alignment = attached

; Visible tooltip components
;   Allowed values: header, primary, secondary, details, quests, pricing
components = header, primary, secondary, details, quests, pricing

; Tooltip scale percentage
;   Examples: 1.0 = 100%, 0.5 = 50%, 2.0 = 200%
scale = 1.0

; Overlay mode: manual (scan by hotkey) or automatic (scan on hover)
;   Allowed values: manual, automatic
default_mode = manual

; Path to Python 3.11 executable (for OCR service)
python_path = python

[hotkeys]

; Price check scan key - press while hovering over an item tooltip
;   Default: XButton1 (mouse side button back)
;   You can change this to any key like F5, Ctrl+Q, etc.
run_price_check = XButton1
