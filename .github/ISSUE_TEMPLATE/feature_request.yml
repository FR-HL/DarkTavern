name: 功能建议
description: 新功能想法 / 改进建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 建议描述
      description: 想要什么功能？解决什么问题？
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
      description: 有没有其他实现方式或现有替代方案？
    validations:
      required: false
