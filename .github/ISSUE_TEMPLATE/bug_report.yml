name: Bug 报告
description: 功能异常 / 崩溃 / 识别错误等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issues，没有重复
          required: true
        - label: 已使用最新版本（或最新 commit）复现
          required: true
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开游戏进入仓库
        2. 按 Ctrl+R
        3. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 游戏分辨率 / 窗口模式、Windows 版本、运行方式（源码 or 安装包）、是否管理员运行
      placeholder: |
        - 分辨率：1920x1080 全屏
        - 运行方式：源码（npm + ocr_env）
        - 管理员运行：是
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        日志位置：%APPDATA%\AdventurersSquire\logs（源码运行）或安装目录 resources\logs。
        可直接粘贴相关片段或上传截图。查价问题请附上悬浮窗截图与物品名。
    validations:
      required: false
