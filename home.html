<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>DarkTavern</title>
<style>
  @font-face {
    font-family: 'SaintKDG';
    src: url('assets/fonts/SaintKDG_Medium.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --bg0: #0c0a14;
    --bg1: #100b1a;
    --stone: #1a1530;
    --stone2: #221b3a;
    --stone3: #2a2147;
    --gold: #ffd400;
    --gold-dim: #b8902a;
    --ember: #ff7a18;
    --teal: #90d9de;
    --text: #ece5d2;
    --muted: #8a8270;
    --line: rgba(255, 212, 0, 0.14);
    --line-soft: rgba(255, 255, 255, 0.05);
    --display: 'SaintKDG', 'Georgia', 'Songti SC', serif;
    --body: 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: var(--body);
    color: var(--text);
    overflow: hidden;
    background:
      radial-gradient(125% 80% at 50% -12%, rgba(255, 122, 24, 0.12), transparent 58%),
      radial-gradient(90% 70% at 88% 118%, rgba(144, 217, 222, 0.06), transparent 60%),
      radial-gradient(120% 120% at 50% 130%, rgba(0, 0, 0, 0.65), transparent 70%),
      linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 55%, #08060e 100%);
  }

  /* faint stone-grain texture, pure CSS */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(25deg, rgba(0,0,0,0.10) 0 3px, transparent 3px 9px);
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: 0.5;
  }

  /* drifting tavern fog */
  .fog {
    position: fixed;
    border-radius: 50%;
    filter: blur(46px);
    pointer-events: none;
    z-index: 0;
  }
  .fog1 {
    width: 520px; height: 360px; left: -120px; top: 30%;
    background: radial-gradient(circle, rgba(255,122,24,0.10), transparent 70%);
    animation: drift1 34s ease-in-out infinite alternate;
  }
  .fog2 {
    width: 600px; height: 420px; right: -160px; bottom: -80px;
    background: radial-gradient(circle, rgba(144,217,222,0.07), transparent 70%);
    animation: drift2 42s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,-40px) scale(1.12); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1.05); } to { transform: translate(-50px,30px) scale(0.95); } }

  .shell {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 22px 26px 16px;
  }

  /* ===== brand bar ===== */
  .brandbar {
    display: flex; align-items: center; gap: 16px;
    animation: fadeDown 0.5s ease both;
  }
  .crest {
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: radial-gradient(circle at 35% 30%, #3a2c08, #15100a 75%);
    color: var(--gold);
    font-family: var(--display);
    font-size: 1.25rem; font-weight: 700;
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px rgba(255,212,0,0.6);
    box-shadow: 0 0 14px rgba(255,212,0,0.30), inset 0 0 12px rgba(255,212,0,0.18);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 12px rgba(255,212,0,0.28), inset 0 0 10px rgba(255,212,0,0.15); }
    50%     { box-shadow: 0 0 24px rgba(255,212,0,0.55), inset 0 0 16px rgba(255,212,0,0.28); }
  }
  .brand-text h1 {
    font-family: var(--display);
    font-size: 2.5rem; line-height: 1;
    letter-spacing: 0.02em;
    color: var(--text);
    text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 0 26px rgba(255,212,0,0.22);
  }
  .tagline {
    margin-top: 6px;
    font-size: 0.78rem; letter-spacing: 0.32em;
    color: var(--gold-dim);
    text-transform: uppercase;
  }
  .brand-meta {
    margin-left: auto;
    font-size: 0.72rem; letter-spacing: 0.14em;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 5px 12px; border-radius: 20px;
    background: rgba(255,212,0,0.03);
  }

  /* ===== main grid ===== */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 18px;
    margin-top: 20px;
    min-height: 0;
  }

  .panel {
    position: relative;
    background: linear-gradient(160deg, var(--stone) 0%, #14102a 100%);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    border-radius: 3px;
  }

  .panel-title {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--display);
    font-size: 1.02rem; letter-spacing: 0.12em;
    color: var(--gold);
    padding-bottom: 12px; margin-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  .status-panel { animation: fadeUp 0.6s ease 0.08s both; }
  .feat-panel   { animation: fadeUp 0.6s ease 0.16s both; }

  /* ===== status rows ===== */
  .stat {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--line-soft);
  }
  .stat:last-child { border-bottom: none; }
  .stat-rune {
    width: 15px; height: 15px; flex: none;
    border-radius: 50%;
    background: #3a3550;
    position: relative;
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  .stat-rune[data-state="pending"] { animation: pulseGray 1.5s ease-in-out infinite; }
  .stat-rune[data-state="ok"] {
    background: radial-gradient(circle at 35% 30%, #ffe26b, var(--gold) 70%);
    box-shadow: 0 0 11px rgba(255,212,0,0.7);
    animation: none;
  }
  .stat-rune[data-state="ok"]::after {
    content: '\2713';
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 0.62rem; font-weight: 700; color: #1a1206;
  }
  @keyframes pulseGray { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  .stat-label {
    font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    margin-top: 3px;
    font-size: 0.96rem; color: var(--muted);
    transition: color 0.4s ease;
  }

  /* ===== feature placeholders ===== */
  .feat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-top: 14px;
  }
  .feat {
    position: relative;
    text-align: left;
    padding: 16px 16px 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: linear-gradient(150deg, var(--stone2), #181230);
    color: var(--text);
    cursor: pointer;
    font-family: var(--body);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    overflow: hidden;
  }
  .feat:nth-child(1) { animation: fadeUp 0.5s ease 0.26s both; }
  .feat:nth-child(2) { animation: fadeUp 0.5s ease 0.32s both; }
  .feat:nth-child(3) { animation: fadeUp 0.5s ease 0.38s both; }
  .feat:nth-child(4) { animation: fadeUp 0.5s ease 0.44s both; }
  .feat:hover {
    transform: translateY(-4px);
    border-color: var(--gold-dim);
    box-shadow: 0 12px 28px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,212,0,0.25);
  }
  .feat:active { transform: translateY(-2px); }
  .feat-title { display: block; font-size: 1.02rem; font-weight: 700; letter-spacing: 0.02em; }
  .feat-sub { display: block; margin-top: 5px; font-size: 0.74rem; color: var(--muted); }
  .soon-tag {
    position: absolute; top: 10px; right: 12px;
    font-size: 0.58rem; letter-spacing: 0.18em; font-weight: 700;
    color: var(--gold-dim);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 6px;
  }

  /* ===== action bar ===== */
  .actionbar {
    display: flex; align-items: center; gap: 12px;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--line);
    animation: fadeUp 0.6s ease 0.3s both;
  }
  .btn {
    font-family: var(--body);
    font-size: 0.86rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 9px 20px; border-radius: 7px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, var(--gold), #e0b400);
    color: #1a1206; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,212,0,0.3); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn.ghost {
    background: transparent; color: var(--gold);
    border-color: var(--line);
  }
  .btn.ghost:hover { background: rgba(255,212,0,0.08); border-color: var(--gold-dim); box-shadow: none; }
  .credit {
    margin-left: auto;
    font-size: 0.72rem; color: var(--muted);
  }
  .credit .grp {
    color: var(--teal); cursor: pointer;
    border-bottom: 1px dashed transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .credit .grp:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* ===== toast ===== */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(8,6,14,0.92);
    border: 1px solid var(--line);
    color: var(--gold);
    padding: 14px 34px; border-radius: 10px;
    font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em;
    z-index: 9999; opacity: 0; pointer-events: none;
    box-shadow: 0 0 30px rgba(255,212,0,0.2);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>

  <div class="shell">
    <header class="brandbar">
      <div class="crest">DT</div>
      <div class="brand-text">
        <h1>DarkTavern</h1>
        <div class="tagline">地牢酒馆 · 悬停即知价</div>
      </div>
      <div class="brand-meta">v1.0 · 中文查价</div>
    </header>

    <main class="grid">
      <section class="panel status-panel">
        <h2 class="panel-title">酒馆情报 <span class="live-dot"></span></h2>

        <div class="stat" id="stat-ocr">
          <div class="stat-rune" data-state="pending"></div>
          <div class="stat-body">
            <div class="stat-label">OCR 侍者</div>
            <div class="stat-value" id="ocr-value">正在唤醒…</div>
          </div>
        </div>

        <div class="stat" id="stat-game">
          <div class="stat-rune" data-state="pending"></div>
          <div class="stat-body">
            <div class="stat-label">游戏窗口</div>
            <div class="stat-value" id="game-value">等待游戏启动…</div>
          </div>
        </div>

        <div class="stat" id="stat-key">
          <div class="stat-rune" data-state="ok"></div>
          <div class="stat-body">
            <div class="stat-label">扫描热键</div>
            <div class="stat-value" id="key-value">XButton1</div>
          </div>
        </div>

        <div class="stat" id="stat-api">
          <div class="stat-rune" data-state="pending"></div>
          <div class="stat-body">
            <div class="stat-label">DarkerDB API</div>
            <div class="stat-value" id="api-value">检测中…</div>
          </div>
        </div>
      </section>

      <section class="panel feat-panel">
        <h2 class="panel-title">功能</h2>
        <div class="feat-grid">
          <button class="feat" data-soon>
            <span class="feat-title">我的配装</span>
            <span class="feat-sub">保存与一键套用</span>
            <span class="soon-tag">SOON</span>
          </button>
          <button class="feat" data-soon>
            <span class="feat-title">市场捡漏</span>
            <span class="feat-sub">实时低价提醒</span>
            <span class="soon-tag">SOON</span>
          </button>
          <button class="feat" data-soon>
            <span class="feat-title">掉落查询</span>
            <span class="feat-sub">怪物掉率地图</span>
            <span class="soon-tag">SOON</span>
          </button>
          <button class="feat" data-soon>
            <span class="feat-title">伤害计算</span>
            <span class="feat-sub">配装模拟推演</span>
            <span class="soon-tag">SOON</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="actionbar">
      <button class="btn" id="btn-settings">设置</button>
      <button class="btn ghost" id="btn-mapping">词条编辑</button>
      <span class="credit">by 7. &amp; 方源Official · 群 <span class="grp" id="grp">376490002</span></span>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const { ipcRenderer, clipboard } = require('electron');
    const OCR = 'http://127.0.0.1:19528';
    const $ = (s) => document.querySelector(s);

    function toast (msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 1600);
    }

    function setOcr (state, count) {
      $('#stat-ocr .stat-rune').dataset.state = state;
      const val = $('#ocr-value');
      if (state === 'ok') {
        val.textContent = (count != null) ? ('已就绪 · ' + count + ' 词条') : '已就绪';
        val.style.color = 'var(--gold)';
      } else {
        val.textContent = '正在唤醒…';
        val.style.color = 'var(--muted)';
      }
    }

    function setGame (found) {
      $('#stat-game .stat-rune').dataset.state = found ? 'ok' : 'pending';
      const val = $('#game-value');
      if (found) { val.textContent = '已检测到游戏'; val.style.color = 'var(--teal)'; }
      else { val.textContent = '等待游戏启动…'; val.style.color = 'var(--muted)'; }
    }

    // OCR health: poll fast until ready, then slow heartbeat
    let ocrReady = false;
    let healthTimer = null;
    async function pollHealth () {
      try {
        const r = await fetch(OCR + '/health');
        const d = await r.json();
        if (d && d.status === 'ok') {
          setOcr('ok', d.mappings);
          if (!ocrReady) {
            ocrReady = true;
            clearInterval(healthTimer);
            healthTimer = setInterval(pollHealth, 5000);
          }
        } else {
          setOcr('pending');
        }
      } catch (e) {
        setOcr('pending');
      }
    }
    pollHealth();
    healthTimer = setInterval(pollHealth, 1200);

    // Game window presence
    async function pollWindow () {
      try {
        const r = await fetch(OCR + '/window');
        const d = await r.json();
        setGame(!!(d && d.found));
      } catch (e) {
        setGame(false);
      }
    }
    pollWindow();
    setInterval(pollWindow, 2000);

    // Settings (scan key + api key state)
    async function loadSettings () {
      try {
        const d = await ipcRenderer.invoke('settings:get');
        $('#key-value').textContent = d.scan_key || 'XButton1';
        const api = $('#api-value');
        const rune = $('#stat-api .stat-rune');
        if (d.api_key) {
          api.textContent = '已配置';
          api.style.color = 'var(--teal)';
          rune.dataset.state = 'ok';
        } else {
          api.textContent = '未配置 · 设置中填写';
          api.style.color = 'var(--muted)';
          rune.dataset.state = 'pending';
        }
      } catch (e) {
        console.warn('settings:get failed', e);
      }
    }
    loadSettings();

    $('#btn-settings').onclick = () => ipcRenderer.send('open-settings');
    $('#btn-mapping').onclick = () => ipcRenderer.send('open-mapping');
    document.querySelectorAll('[data-soon]').forEach((b) => {
      b.onclick = () => toast('敬请期待 · 即将上线');
    });
    $('#grp').onclick = () => {
      clipboard.writeText('376490002');
      toast('群号已复制');
    };
  </script>
</body>
</html>
